name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TEST_POSTGRESQL_URL: postgresql+psycopg://habit_quest_ci:ci_only_password@127.0.0.1:54320/habit_quest_ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: habit_quest_ci
          POSTGRES_USER: habit_quest_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - "54320:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U habit_quest_ci -d habit_quest_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11' # Match runtime.txt.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -ra

      - name: Compile Python sources
        run: python -m compileall -q app src tests migrations

      - name: Require PostgreSQL integration tests
        run: |
          : "${TEST_POSTGRESQL_URL:?Set TEST_POSTGRESQL_URL to the disposable PostgreSQL service}"
          report="$RUNNER_TEMP/postgresql-results.xml"
          python -m pytest -ra tests/test_postgresql.py --junitxml="$report"

          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "test_import_preserves_history_and_generates_new_ids",
              "test_import_rolls_back_if_sqlite_contains_an_orphaned_checkin",
              "test_legacy_data_stays_hidden_until_assigned_to_the_selected_google_account",
          }
          cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          missing = required - {case.attrib["name"] for case in cases}
          if missing:
              raise SystemExit("Missing PostgreSQL cases: " + ", ".join(sorted(missing)))

          nonpassing = [
              case.attrib["name"]
              for case in cases
              if any(case.find(outcome) is not None for outcome in ("skipped", "failure", "error"))
          ]
          if nonpassing:
              raise SystemExit("PostgreSQL cases did not pass: " + ", ".join(nonpassing))

          print(f"Verified all {len(required)} required PostgreSQL integration cases passed.")
          PY
